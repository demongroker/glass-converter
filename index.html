<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark"><meta name="theme-color" content="#070914">
<title>Glass Converter</title>
<style>
:root{--fg:#f4f6ff;--mut:rgba(226,232,255,.6);--mut2:rgba(226,232,255,.4);--glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.1);--line:rgba(255,255,255,.14);--line2:rgba(255,255,255,.08);--acc:#9db4ff;--acc2:#c79bff;--r:24px;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#070914;color:var(--fg);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.blobs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:m 28s ease-in-out infinite alternate}
.blob:nth-child(1){width:70vmax;height:70vmax;background:#3b4dff;left:-30vmax;top:-25vmax}
.blob:nth-child(2){width:55vmax;height:55vmax;background:#a23bff;right:-25vmax;top:15vh;animation-duration:34s;animation-delay:-9s}
.blob:nth-child(3){width:50vmax;height:50vmax;background:#00b39a;left:-15vmax;bottom:-25vmax;animation-duration:40s;animation-delay:-15s;opacity:.4}
.blob:nth-child(4){width:35vmax;height:35vmax;background:#ff6a5c;right:-10vmax;bottom:-10vmax;animation-duration:30s;opacity:.3}
@keyframes m{to{transform:translate(6vmax,8vmax) scale(1.12)}}
main{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:calc(var(--s5) + env(safe-area-inset-top)) var(--s4) var(--s6)}
.glass{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.04));backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 24px 60px -24px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.18)}
header{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);padding:0 var(--s1) var(--s4)}
h1{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0}
.upd{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:var(--s2);padding:6px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--line2);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 8px #34d399}.dot.off{background:#fbbf24;box-shadow:0 0 8px #fbbf24}
.card{padding:var(--s5)}
.lbl{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);font-weight:600}
.amt{display:flex;align-items:baseline;gap:var(--s2);margin:var(--s2) 0 var(--s5);padding-bottom:var(--s3);border-bottom:1px solid var(--line2)}
.amt .sym{font-size:24px;color:var(--mut);font-weight:500}
#amount{all:unset;flex:1;min-width:0;font-size:48px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;caret-color:var(--acc)}
.pair{position:relative;display:flex;flex-direction:column;gap:var(--s2)}
.chip{position:relative;overflow:hidden;display:flex;align-items:center;gap:var(--s3);min-width:0;min-height:60px;padding:var(--s3) var(--s4);border-radius:18px;border:1px solid var(--line2);color:inherit;font:inherit;cursor:pointer;background:var(--glass);text-align:left;transition:transform .3s cubic-bezier(.2,.8,.2,1),background .25s,border-color .25s}
.chip:hover{background:var(--glass2);border-color:var(--line)}.chip:active{transform:scale(.98)}
.pair .chip::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--mut2);border-bottom:2px solid var(--mut2);transform:rotate(45deg) translateY(-3px);flex:none}
.flag{font-size:26px;line-height:1;flex:none}.code{font-weight:700;font-size:17px}.nm{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chip div{display:flex;overflow:hidden;flex-direction:column;align-items:flex-start;min-width:0}
#swap{position:absolute;right:52px;top:50%;margin-top:-22px;z-index:2;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);cursor:pointer;color:var(--fg);background:rgba(30,34,64,.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 8px 20px -8px rgba(0,0,0,.6);transition:transform .6s cubic-bezier(.34,1.4,.64,1);overflow:hidden;display:grid;place-items:center}
#swap svg{width:20px;height:20px}
.res{margin-top:var(--s5);padding:var(--s4);border-radius:18px;background:linear-gradient(135deg,rgba(157,180,255,.14),rgba(199,155,255,.08));border:1px solid var(--line2)}
#result{font-size:36px;font-weight:700;letter-spacing:-.025em;font-variant-numeric:tabular-nums;margin:var(--s1) 0;background:linear-gradient(110deg,#fff 30%,var(--acc) 70%,var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;overflow-wrap:anywhere;line-height:1.15}
#rate{font-size:13px;color:var(--mut)}
.favs{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s4)}
.fav{flex:1 1 calc(33.333% - var(--s2));justify-content:center;min-height:44px;padding:0 var(--s2);border-radius:999px;font-size:14px;font-weight:600;gap:6px}
.fav .flag{font-size:16px}
.fav.on{background:linear-gradient(135deg,#7f9cff,#a97dff);border-color:transparent;color:#fff;box-shadow:0 8px 20px -8px #7f9cff}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin:var(--s6) var(--s1) var(--s3);font-weight:600}
.list{padding:var(--s2)}
.row{position:relative;overflow:hidden;display:flex;align-items:center;gap:var(--s3);min-height:64px;padding:var(--s3);border-radius:16px;cursor:pointer;transition:background .25s,transform .3s;animation:in .5s cubic-bezier(.2,.8,.2,1) both}
.row:active{transform:scale(.98)}.row:hover{background:rgba(255,255,255,.06)}
.row+.row::before{content:"";position:absolute;top:0;left:54px;right:12px;height:1px;background:var(--line2)}
.row>div:not(.v){min-width:0}
.row .v{margin-left:auto;text-align:right;font-weight:650;font-variant-numeric:tabular-nums;font-size:16px;white-space:nowrap}
.row .v small{display:block;font-size:11px;color:var(--mut);font-weight:500;margin-top:2px}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.18);transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(4);opacity:0}}
dialog{border:0;padding:0;background:transparent;color:inherit;width:min(440px,calc(100vw - 32px));max-height:80vh}
dialog::backdrop{background:rgba(4,6,16,.55);backdrop-filter:blur(8px)}
dialog .glass{background:rgba(22,26,52,.85)}
dialog[open] .glass{animation:pop .35s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:translateY(16px) scale(.97);opacity:0}}
#q{all:unset;display:block;width:calc(100% - 32px);margin:var(--s4);padding:14px var(--s4);border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--line2);box-sizing:border-box}
#all{max-height:60vh;overflow:auto;padding:0 var(--s2) var(--s2)}
.foot{text-align:center;font-size:12px;color:var(--mut2);margin-top:var(--s5)}
@media (min-width:700px){main{padding-top:64px}}
html.static *{animation-play-state:paused;transition:none!important}html.static .row{animation:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="blobs" aria-hidden="true"><div class="blob"></div><div class="blob"></div><div class="blob"></div><div class="blob"></div></div>
<main id="main">
<header><h1>Converter</h1><div class="upd" aria-live="polite"><span class="dot" id="dot"></span><span id="upd">Loading rates…</span></div></header>
<section class="glass card" id="card">
<label class="lbl" for="amount">Amount</label>
<div class="amt"><span class="sym" id="sym"></span><input id="amount" inputmode="decimal" autocomplete="off" aria-label="Amount to convert" value="100"></div>
<div class="pair">
<button class="chip" id="fromBtn" aria-label="Choose source currency"></button>
<button id="swap" aria-label="Swap currencies"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v14m0 0-3-3m3 3 3-3M17 20V6m0 0-3 3m3-3 3 3"/></svg></button>
<button class="chip" id="toBtn" aria-label="Choose target currency"></button>
</div>
<div class="res"><div class="lbl" id="resLbl">Result</div><div id="result" aria-live="polite">—</div><div id="rate"></div></div>
<div class="favs" id="favs" role="group" aria-label="Quick pick target currency"></div>
</section>
<h2>Across your ports</h2>
<section class="glass list" id="list" aria-label="Conversions to favourite currencies"></section>
<div class="foot">Rates: fawazahmed0 currency-api (daily) · fallback open.er-api.com · works offline</div>
</main>
<dialog id="dlg" aria-label="Select currency"><div class="glass"><input id="q" placeholder="Search currency" aria-label="Search currency"><div id="all"></div></div></dialog>
<script>
const N={USD:["US Dollar","🇺🇸"],EUR:["Euro","🇪🇺"],SGD:["Singapore Dollar","🇸🇬"],MYR:["Malaysian Ringgit","🇲🇾"],IDR:["Indonesian Rupiah","🇮🇩"],PHP:["Philippine Peso","🇵🇭"],GBP:["British Pound","🇬🇧"],JPY:["Japanese Yen","🇯🇵"],CNY:["Chinese Yuan","🇨🇳"],HKD:["Hong Kong Dollar","🇭🇰"],THB:["Thai Baht","🇹🇭"],VND:["Vietnamese Dong","🇻🇳"],KRW:["South Korean Won","🇰🇷"],TWD:["Taiwan Dollar","🇹🇼"],AUD:["Australian Dollar","🇦🇺"],NZD:["NZ Dollar","🇳🇿"],INR:["Indian Rupee","🇮🇳"],BND:["Brunei Dollar","🇧🇳"],AED:["UAE Dirham","🇦🇪"],SAR:["Saudi Riyal","🇸🇦"],CHF:["Swiss Franc","🇨🇭"],CAD:["Canadian Dollar","🇨🇦"],MOP:["Macanese Pataca","🇲🇴"],KHR:["Cambodian Riel","🇰🇭"],LKR:["Sri Lankan Rupee","🇱🇰"],NPR:["Nepalese Rupee","🇳🇵"],BDT:["Bangladeshi Taka","🇧🇩"],PKR:["Pakistani Rupee","🇵🇰"],MMK:["Myanmar Kyat","🇲🇲"],LAK:["Lao Kip","🇱🇦"],TRY:["Turkish Lira","🇹🇷"],SEK:["Swedish Krona","🇸🇪"],NOK:["Norwegian Krone","🇳🇴"],DKK:["Danish Krone","🇩🇰"],ZAR:["South African Rand","🇿🇦"],MXN:["Mexican Peso","🇲🇽"],BRL:["Brazilian Real","🇧🇷"],RUB:["Russian Ruble","🇷🇺"],QAR:["Qatari Riyal","🇶🇦"],KWD:["Kuwaiti Dinar","🇰🇼"]};
const FAV=["SGD","MYR","IDR","PHP","USD","EUR"],$=s=>document.getElementById(s),LS="glassfx";
let rates=null,ts=0,st=JSON.parse(localStorage.getItem(LS+":st")||'{"a":"100","f":"SGD","t":"IDR"}');
const h=location.hash.slice(1).split(",");if(h.length==3){st={a:h[0],f:h[1].toUpperCase(),t:h[2].toUpperCase()}}
const nm=c=>(N[c]||[c,"🏳️"]);
const dec=c=>["IDR","JPY","KRW","VND","KHR","LAK","MMK"].includes(c)?0:2;
const fmt=(v,c)=>SY[c]&&SY[c].includes("$")?SY[c]+new Intl.NumberFormat(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}).format(v):new Intl.NumberFormat(undefined,{style:"currency",currency:c,currencyDisplay:"narrowSymbol",minimumFractionDigits:dec(c),maximumFractionDigits:dec(c)}).format(v);
const SY={SGD:'S$',MYR:'RM',IDR:'Rp',PHP:'₱',USD:'US$',EUR:'€',AUD:'A$',HKD:'HK$'};const sym=c=>{if(SY[c])return SY[c];try{return new Intl.NumberFormat("en",{style:"currency",currency:c,currencyDisplay:"narrowSymbol"}).formatToParts(0).find(p=>p.type=="currency").value}catch(e){return c}};
const amt=()=>parseFloat(String(st.a).replace(/,/g,""))||0;
const conv=(v,f,t)=>rates&&rates[f]&&rates[t]?v/rates[f]*rates[t]:NaN;
function chip(el,c){const[n,f]=nm(c);el.innerHTML=`<span class="flag" aria-hidden="true">${f}</span><div><span class="code">${c}</span><span class="nm">${n}</span></div>`;el.setAttribute("aria-label",(el.id=="fromBtn"?"From ":"To ")+n+", change")}
const STATIC=/static/.test(location.search);if(STATIC)document.documentElement.classList.add('static');let cur=0,raf;function countTo(v,c){if(STATIC){$('result').textContent=fmt(v,c);cur=v;return}cancelAnimationFrame(raf);const s=isFinite(cur)?cur:0,t0=performance.now(),d=700;(function step(n){const p=Math.max(0,Math.min(1,(n-t0)/d)),e=1-Math.pow(1-p,4);cur=s+(v-s)*e;$("result").textContent=fmt(cur,c);if(p<1)raf=requestAnimationFrame(step);else cur=v})(t0)}
function render(full){localStorage.setItem(LS+":st",JSON.stringify(st));chip($("fromBtn"),st.f);chip($("toBtn"),st.t);$("sym").textContent=sym(st.f);
$("resLbl").textContent=nm(st.t)[0];const v=conv(amt(),st.f,st.t);
if(isFinite(v)){countTo(v,st.t);const r=conv(1,st.f,st.t);$("rate").textContent=`1 ${st.f} = ${new Intl.NumberFormat(undefined,{maximumSignificantDigits:6}).format(r)} ${st.t}`}else{$("result").textContent="—";$("rate").textContent=rates?"Rate unavailable":"Waiting for rates…"}
$("favs").innerHTML=FAV.map(c=>`<button class="chip fav${c==st.t?" on":""}" data-c="${c}" aria-pressed="${c==st.t}"><span class="flag">${nm(c)[1]}</span>${c}</button>`).join("");
const L=FAV.filter(c=>c!=st.f);$("list").innerHTML=L.map((c,i)=>{const x=conv(amt(),st.f,c);return`<div class="row" role="button" tabindex="0" data-c="${c}" style="animation-delay:${full?i*50:0}ms;${full?"":"animation:none"}"><span class="flag" aria-hidden="true">${nm(c)[1]}</span><div><div class="code">${c}</div><div class="nm" style="font-size:12px;color:var(--mut)">${nm(c)[0]}</div></div><div class="v">${isFinite(x)?fmt(x,c):"—"}<small>1 ${st.f} = ${isFinite(x)?new Intl.NumberFormat(undefined,{maximumSignificantDigits:5}).format(conv(1,st.f,c)):"—"}</small></div></div>`}).join("")}
function ago(){if(!ts)return;const d=new Date(ts).toLocaleDateString(undefined,{day:"numeric",month:"short"});$("upd").textContent="Daily rate · "+d+(navigator.onLine?"":" · offline");$("dot").className="dot"+(navigator.onLine&&(Date.now()-ts)<86400e3*2.5?"":" off")}
const SRC=["https://latest.currency-api.pages.dev/v1/currencies/usd.json","https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json"];
async function fa(u){const j=await (await fetch(u,{cache:"no-cache"})).json();const r={};for(const k in j.usd)r[k.toUpperCase()]=j.usd[k];if(!r.EUR)throw 0;return{r,t:Date.parse(j.date+"T12:00:00Z")}}
async function er(){const j=await (await fetch("https://open.er-api.com/v6/latest/USD")).json();if(j.result!="success")throw 0;return{r:j.rates,t:j.time_last_update_unix*1e3}}
async function load(){const c=JSON.parse(localStorage.getItem(LS+":r")||"null");if(c){rates=c.r;ts=c.t;render(1);ago()}
const got=(await Promise.allSettled([...SRC.map(fa),er()])).filter(x=>x.status=="fulfilled").map(x=>x.value);
if(!got.length){if(!c)$("upd").textContent="Offline · no cached rates";$("dot").className="dot off";return}
const best=got.sort((x,y)=>y.t-x.t)[0];rates=best.r;ts=best.t;
localStorage.setItem(LS+":r",JSON.stringify({r:rates,t:ts}));render(!c);ago();document.body.dataset.ready=1}
setInterval(ago,60000);setInterval(load,3600e3);
$("amount").value=st.a;$("amount").addEventListener("input",e=>{let v=e.target.value.replace(/[^\d.,]/g,"");st.a=v;e.target.value=v;render(0)});
$("amount").addEventListener("blur",e=>{const n=amt();e.target.value=n?new Intl.NumberFormat(undefined,{maximumFractionDigits:2}).format(n):"";});
$("amount").addEventListener("focus",e=>{e.target.value=String(amt()||"")});
$("amount").dispatchEvent(new Event("blur"));
let rot=0;$("swap").onclick=()=>{rot+=180;$("swap").style.transform=`rotate(${rot}deg)`;[st.f,st.t]=[st.t,st.f];cur=0;render(1)};
$("favs").onclick=e=>{const b=e.target.closest(".fav");if(!b)return;if(b.dataset.c==st.f)st.f=st.t;st.t=b.dataset.c;render(0)};
$("list").onclick=e=>{const r=e.target.closest(".row");if(r){st.t=r.dataset.c;render(0);window.scrollTo({top:0,behavior:"smooth"})}};
let tgt;const dlg=$("dlg");function pick(w){tgt=w;$("q").value="";fill();dlg.showModal()}
function fill(){const q=$("q").value.toLowerCase(),ks=[...new Set([...FAV,...Object.keys(N),...Object.keys(rates||{})])].filter(c=>(rates?rates[c]:1)&&(c+nm(c)[0]).toLowerCase().includes(q));$("all").innerHTML=ks.map(c=>`<div class="row" role="option" tabindex="0" data-c="${c}" style="animation:none"><span class="flag">${nm(c)[1]}</span><div><div class="code">${c}</div><div style="font-size:12px;color:var(--mut)">${nm(c)[0]}</div></div></div>`).join("")}
$("q").oninput=fill;$("all").onclick=e=>{const r=e.target.closest(".row");if(!r)return;st[tgt]=r.dataset.c;dlg.close();cur=0;render(1)};
dlg.onclick=e=>{if(e.target==dlg)dlg.close()};
$("fromBtn").onclick=()=>pick("f");$("toBtn").onclick=()=>pick("t");
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.classList.contains("row"))e.target.click()});
document.addEventListener("pointerdown",e=>{const b=e.target.closest(".chip,#swap,.row");if(!b)return;const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height),d=document.createElement("span");d.className="ripple";d.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;b.appendChild(d);setTimeout(()=>d.remove(),650)});
function tilt(x,y){document.querySelectorAll(".glass").forEach(g=>{g.style.setProperty("--sx",x*30+"px");g.style.setProperty("--sy",y*20+"px")})}
addEventListener("mousemove",e=>tilt(e.clientX/innerWidth-.5,e.clientY/innerHeight-.5));
addEventListener("deviceorientation",e=>{if(e.gamma!=null)tilt(Math.max(-1,Math.min(1,e.gamma/45))*.5,Math.max(-1,Math.min(1,(e.beta-45)/45))*.5)});
addEventListener("online",load);render(1);load();
</script></body></html>
